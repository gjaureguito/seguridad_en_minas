# Desarrollo local: docker compose up  →  http://localhost:8080
services:
  db:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: seguridad_mina }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  app:
    build: .
    ports: ["8080:8080"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/seguridad_mina
      ADMIN_EMAIL: admin@local
      ADMIN_PASSWORD: admin12345
      APP_DEBUG: "1"
    depends_on: [db]
volumes: { pgdata: {} }
